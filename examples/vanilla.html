<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vanilla JS - @javaabu/i18n</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <nav><button id="switch" data-trans="Switch language"></button></nav>
    <h1 data-trans="Welcome, :name!" data-trans-replace='{"name":"Ali"}'></h1>
    <p data-trans="messages.unread" data-trans-count="3"></p>
    <label data-trans="Message" for="message"></label>
    <input id="message" name="message" data-trans-attr-placeholder="Message" />
    <script type="module" src="./vanilla.ts"></script>
  </body>
</html>
